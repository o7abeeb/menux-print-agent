name: Android build check

# Builds the Android app whenever its code changes (no release, nothing
# published): catches compile errors before a version tag ever runs. The
# signed APK is kept as a run artifact for testing on a real device.
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Signing key
        run: echo "$KS" | base64 -d > "$RUNNER_TEMP/menux-print.p12"
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      - name: Build APK
        working-directory: android
        run: gradle assembleRelease -PversionName="0.0.${GITHUB_RUN_NUMBER}-ci" -PversionCode=1 --stacktrace
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/menux-print.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      - uses: actions/upload-artifact@v4
        with:
          name: Menux-Print-apk
          path: android/app/build/outputs/apk/release/app-release.apk
