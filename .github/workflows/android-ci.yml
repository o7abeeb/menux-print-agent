name: Android build check

# Builds the Android app whenever its code changes (no release, nothing
# published): catches compile errors before a version tag ever runs. The
# signed APK is kept as a run artifact for testing on a real device.
on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-ci.yml'
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the APK to this existing release (e.g. v0.2.1), built with its version. Empty = artifact only."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Signing key
        run: echo "$KS" | base64 -d > "$RUNNER_TEMP/menux-print.p12"
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      - name: Build APK
        working-directory: android
        run: |
          if [ -n "$TAG" ]; then
            V="${TAG#v}"; IFS=. read -r MA MI PA <<< "$V"; CODE=$(( MA * 10000 + MI * 100 + PA ))
          else
            V="0.0.${GITHUB_RUN_NUMBER}-ci"; CODE=1
          fi
          gradle assembleRelease -PversionName="$V" -PversionCode="$CODE" --stacktrace
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/menux-print.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TAG: ${{ inputs.release_tag }}
      - uses: actions/upload-artifact@v4
        with:
          name: Menux-Print-apk
          path: android/app/build/outputs/apk/release/app-release.apk
      - name: Attach to the release
        if: inputs.release_tag != ''
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Menux-Print.apk
          gh release upload "${{ inputs.release_tag }}" Menux-Print.apk --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
