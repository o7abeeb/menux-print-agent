name: Build & publish release

# Runs on windows-latest specifically because it already has Developer
# Mode / symlink privileges enabled out of the box -- the exact thing
# that blocks `electron-builder`'s NSIS build (and therefore auto-update,
# which needs a real NSIS installer, not the portable-zip fallback) on a
# normal dev machine without elevation. Building here sidesteps that
# entirely instead of requiring anyone to change a machine setting.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx electron-builder --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Linux (AppImage, self-updating like the Windows installer). Runs after
  # the Windows job so the two never race to create the same GitHub release;
  # electron-builder then just adds the Linux files (+ latest-linux.yml) to it.
  linux:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx electron-builder --linux --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Android (APK, sideloaded from the stable "latest" link). Version comes
  # from the tag: v0.3.0 -> versionName 0.3.0, versionCode 300.
  android:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Signing key
        run: echo "$KS" | base64 -d > "$RUNNER_TEMP/menux-print.p12"
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      - name: Build APK
        working-directory: android
        run: |
          V="${GITHUB_REF_NAME#v}"
          IFS=. read -r MA MI PA <<< "$V"
          CODE=$(( MA * 10000 + MI * 100 + PA ))
          gradle assembleRelease -PversionName="$V" -PversionCode="$CODE"
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/menux-print.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      - name: Attach to the release
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Menux-Print.apk
          gh release upload "$GITHUB_REF_NAME" Menux-Print.apk --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
