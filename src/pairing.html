<!doctype html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<title>إعداد وكيل الطباعة</title>
<style>
  body { font-family: -apple-system, "Segoe UI", Tahoma, sans-serif; padding: 20px; background: #FAF9F5; color: #222; }
  h2 { font-size: 16px; margin: 0 0 4px; }
  p.hint { font-size: 12px; color: #777; margin: 0 0 16px; }
  label { display: block; font-size: 13px; font-weight: 600; margin: 12px 0 4px; }
  input { width: 100%; box-sizing: border-box; padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; }
  button { margin-top: 18px; width: 100%; padding: 10px; border: none; border-radius: 6px; background: #074942; color: #fff; font-weight: 700; cursor: pointer; }
  #status { margin-top: 10px; font-size: 12px; }
  #status.ok { color: #1D7A5F; }
  #status.err { color: #B23A32; }
</style>
</head>
<body>
  <h2>ربط وكيل الطباعة بحساب Menux</h2>
  <p class="hint">افتح لوحة التحكم ← الإعدادات ← الطابعات ← إضافة طابعة ← شبكة (عبر وكيل)، ثم انسخ رمز الإقران والصقه هنا.</p>

  <label>رمز الإقران</label>
  <input type="text" id="pairingToken" placeholder="pairing token">

  <details style="margin-top:14px">
    <summary style="font-size:12px;color:#777;cursor:pointer">خيارات متقدمة</summary>
    <label>رابط الموقع</label>
    <input type="text" id="siteUrl" placeholder="https://menux.app" dir="ltr">
  </details>

  <button id="saveBtn">حفظ</button>
  <div id="status"></div>

  <script>
    (async function () {
      var cfg = await window.menuxAgent.getConfig();
      document.getElementById('siteUrl').value = cfg.siteUrl || '';
      document.getElementById('pairingToken').value = cfg.pairingToken || '';

      document.getElementById('saveBtn').addEventListener('click', async function () {
        var siteUrl = document.getElementById('siteUrl').value.trim() || 'https://menux.app';
        var pairingToken = document.getElementById('pairingToken').value.trim();
        var status = document.getElementById('status');
        if (!pairingToken) {
          status.className = 'err';
          status.textContent = 'الرجاء إدخال رمز الإقران.';
          return;
        }
        await window.menuxAgent.saveConfig({ siteUrl: siteUrl, pairingToken: pairingToken });
        status.className = 'ok';
        status.textContent = 'تم الحفظ — الوكيل يعمل الآن بالخلفية.';
      });
    })();
  </script>
</body>
</html>
